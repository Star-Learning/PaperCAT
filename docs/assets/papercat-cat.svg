<svg width="820" height="360" viewBox="0 0 820 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">PaperCAT desktop cat</title>
  <desc id="desc">A black desktop cat with cream face, teal collar, bell, paper snack, and thinking bubbles.</desc>
  <defs>
    <linearGradient id="body" x1="266" y1="102" x2="430" y2="304" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B3732"/>
      <stop offset="0.55" stop-color="#252B28"/>
      <stop offset="1" stop-color="#151B19"/>
    </linearGradient>
    <linearGradient id="face" x1="330" y1="140" x2="330" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7E9"/>
      <stop offset="1" stop-color="#EEE3D1"/>
    </linearGradient>
    <linearGradient id="bell" x1="410" y1="240" x2="410" y2="271" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD86E"/>
      <stop offset="1" stop-color="#D99A2B"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="820" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFCF6"/>
      <stop offset="1" stop-color="#EEF7F3"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="18" flood-color="#231B17" flood-opacity="0.22"/>
    </filter>
    <filter id="bubbleShadow" x="-20%" y="-30%" width="140%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#2D261F" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect x="12" y="12" width="796" height="336" rx="34" fill="url(#panel)" stroke="#E4DDD0"/>
  <ellipse cx="405" cy="298" rx="168" ry="32" fill="#443025" opacity="0.18"/>

