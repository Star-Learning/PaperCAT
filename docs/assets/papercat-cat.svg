    <text x="132" y="78" fill="#2B2824" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="750">PaperCAT</text>
    <text x="132" y="111" fill="#59645F" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">Feed a PDF once. Read it with a cat later.</text>
